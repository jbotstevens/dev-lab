---
# Quant Services Layer - Complete deployment including Kafka infrastructure and applications
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: quant-services-layer
  namespace: flux-system
resources:
  # Foundation - Namespace and basic setup
  - namespace.yaml
  
  # Infrastructure Phase - Redis and Kafka (must come before applications)
  - component-kustomizations/redis-infrastructure.yaml
  - component-kustomizations/kafka-infrastructure.yaml
  
  # Applications Phase - All quant services (depends on infrastructure)
  - component-kustomizations/quant-applications.yaml
  
commonLabels:
  app.kubernetes.io/part-of: quant-services-layer
  app.kubernetes.io/managed-by: flux
  quant.profile: production
