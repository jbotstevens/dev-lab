---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quant-services-layer
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: quant-services
  path: "./quant-services-layer"
  prune: true
  wait: true
  timeout: 15m
  # Depend on container registry being available
  dependsOn:
    - name: dev-lab-registry
  # Apply patches for service mesh integration
  patches:
    # Enable Linkerd service mesh injection for all quant-services pods
    - target:
        kind: Namespace
        name: quant-services
      patch: |
        - op: add
          path: /metadata/annotations
          value:
            linkerd.io/inject: enabled
            config.linkerd.io/proxy-cpu-limit: "1"
            config.linkerd.io/proxy-memory-limit: "512Mi"
