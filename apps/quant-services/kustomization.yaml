---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quant-services

# HelmReleases for quant-services following ATS pattern
# These reference the hashed ConfigMap names via kustomizeconfig.yaml

resources:
  - adh-consumer.yaml
  - betticker-ws.yaml
  - dash-auth.yaml
  - dash-ws.yaml
  - external-prices-gather.yaml
  - nba-livescores.yaml
  - news-gather.yaml
  - rapid-pini-feeder.yaml
  - rw-proj-min-store.yaml
  - rw-proj-min.yaml
  - unabated-news-feeder.yaml
  - wnba-reports.yaml

# Enable ConfigMap name reference updates (links to hashed ConfigMap)
configurations:
  - kustomizeconfig.yaml