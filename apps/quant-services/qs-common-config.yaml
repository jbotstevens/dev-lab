---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qs-common-config
  namespace: quant-services
data:
  # Image registry configuration for quant-services
  image.registry: "docker-registry.dev-lab-registry.svc.cluster.local:5000"
  image.repository: ""
  
  # Kafka configuration
  kafka.bootstrap.servers: "quant-cluster-kafka-bootstrap.quant-services.svc.cluster.local:9192"
  
  # Redis configuration  
  redis.host: "redis-master.redis.svc.cluster.local"
  redis.port: "6379"
  
  # Dashboard Redis configuration
  dash.redis.host: "redis-master.redis.svc.cluster.local"
  dash.redis.port: "6379"