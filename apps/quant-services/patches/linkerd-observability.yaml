# Service Mesh Observability Patch for Quant Services
# This patch adds monitoring and observability configurations that work well with Linkerd

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: observability-patch  # Template for observability enhancements
spec:
  values:
    # Enhanced monitoring for service mesh
    podAnnotations:
      # Prometheus scraping configuration for Linkerd metrics
      prometheus.io/scrape: "true"
      prometheus.io/port: "4191"  # Linkerd proxy admin port
      prometheus.io/path: "/metrics"
      
      # Application metrics (if services expose them)
      prometheus.io/scrape-app: "true"
      prometheus.io/port-app: "8080"  # Adjust per service
      prometheus.io/path-app: "/metrics"
      
    # Service configuration for better observability
    service:
      annotations:
        # Service monitor annotations
        prometheus.io/probe: "true"
        prometheus.io/probe-path: "/health"
      
    # Optional: Health check configuration that works with mesh
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
        scheme: HTTP
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3