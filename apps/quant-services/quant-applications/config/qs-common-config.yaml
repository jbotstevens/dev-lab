---
image:
  registry: "localhost:5000"
  repository: ""
  pullPolicy: "IfNotPresent"
resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"
serviceAccount:
  create: true
  annotations: {}
podAnnotations:
  linkerd.io/inject: "enabled"
  config.linkerd.io/skip-outbound-ports: "5000"
env:
  ADH_KAFKA_BOOTSTRAP_SERVERS: "ADH_KAFKA_BOOTSTRAP_SERVERS"
  ADH_KAFKA_TOPIC: "ADH_KAFKA_TOPIC"
  KAFKA_BOOTSTRAP_SERVERS: "quant-kafka-service.quant-services.svc.cluster.local:9192"