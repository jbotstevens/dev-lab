apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adh-consumer
spec:
  interval: 1h0m0s
  chart:
    spec:
      chart: ./charts/adh-consumer
      sourceRef:
        kind: GitRepository
        name: quant-services
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: qs-common-config
    valuesKey: values.yaml
  values:
    image:
      name: adh-consumer
      tag: 1.0.0
