apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: betticker-ws
  namespace: flux-system
spec:
  interval: 1h0m0s
  targetNamespace: quant-services
  chart:
    spec:
      chart: ./charts/betticker-ws
      sourceRef:
        kind: GitRepository
        name: quant-services
        namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: qs-common-config
    namespace: quant-services
    valuesKey: values.yaml
  values:
    image:
      name: betticker-ws
      tag: 1.0.0
